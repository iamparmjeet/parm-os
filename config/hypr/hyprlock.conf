source = ~/.cache/parm/themes/current/hyprlock-colors.conf

general {
  hide_cursor = true
  grace = 2
}

background {
  monitor =
  path = $wallpaper
  blur_passes = 3
  blur_size = 8
  color = $background
}

input-field {
  monitor =
  size = 320, 58
  outline_thickness = 3
  outer_color = $primary
  inner_color = $surface
  font_color = $on_surface
  fade_on_empty = false
  placeholder_text = Enter password
  dots_spacing = 0.25
  dots_center = true
  position = 0, -80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $on_surface
  font_size = 72
  font_family = JetBrainsMono Nerd Font
  position = 0, 80
  halign = center
  valign = center
}
